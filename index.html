<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a2825">
<title>Limits Pace</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  @font-face { font-family: Manrope; font-style: normal; font-weight: 200 800; font-display: swap; src: url(fonts/manrope.woff2) format("woff2"); }
  :root {
    --bg: #e6e3de; --text: #4a4540; --muted: #8a837a; --dark: #c4c1bd; --light: #ffffff; --accent: #c96442;
    --hair: rgba(0, 0, 0, 0.06); --hi: rgba(255, 255, 255, 0.5); --track: #d8d4ce; --off: rgba(138, 131, 122, 0.28);
    --disc: 0 3px 6px rgba(0, 0, 0, 0.16), 0 1px 1px rgba(0, 0, 0, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.7);
  }
  /* Dark follows the system unless the theme button has chosen; the block is stated twice for that. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme=light]) {
      --bg: #2a2825; --text: #e8e2da; --muted: #9a938a; --dark: #1c1b19; --light: #383531; --accent: #e0855f;
      --hair: rgba(255, 255, 255, 0.07); --hi: rgba(255, 255, 255, 0.04); --track: #211f1d; --off: rgba(154, 147, 138, 0.22);
      --disc: 0 3px 6px rgba(0, 0, 0, 0.55), 0 1px 1px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.07);
    }
  }
  :root[data-theme=dark] {
    --bg: #2a2825; --text: #e8e2da; --muted: #9a938a; --dark: #1c1b19; --light: #383531; --accent: #e0855f;
    --hair: rgba(255, 255, 255, 0.07); --hi: rgba(255, 255, 255, 0.04); --track: #211f1d; --off: rgba(154, 147, 138, 0.22);
    --disc: 0 3px 6px rgba(0, 0, 0, 0.55), 0 1px 1px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.07);
  }
  :root { --gap: 24px; --frame: max(var(--gap), env(safe-area-inset-top), env(safe-area-inset-bottom)); }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); overscroll-behavior: none; transition: background-color 0.35s; }
  .hero, .card, .knob, .sheet, .well, .segmented button, .stat { transition: background-color 0.35s, box-shadow 0.35s, color 0.35s; }
  body {
    font: 16px/1.4 Manrope, system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text);
    display: flex; justify-content: center;
    padding: var(--frame) max(16px, env(safe-area-inset-right)) var(--frame) max(16px, env(safe-area-inset-left));
  }
  main { width: 100%; max-width: 440px; min-height: calc(100svh - 2 * var(--frame)); display: grid; grid-template-rows: 1fr auto; gap: var(--gap); }
  button { all: unset; font: inherit; -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }
  .row { display: flex; white-space: nowrap; justify-content: space-between; gap: 12px; }
  .muted { color: var(--muted); }
  .caps { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .caps-sm { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .hero { border-radius: 30px; padding: 26px 22px 24px; background: var(--bg); box-shadow: 14px 14px 30px var(--dark), -12px -12px 26px var(--light), inset 0 0 0 1px var(--hi); }
  .card { border-radius: 22px; background: var(--bg); box-shadow: 10px 10px 22px var(--dark), -10px -10px 22px var(--light); }
  .well { box-shadow: inset 3px 3px 6px var(--dark), inset -3px -3px 6px var(--light); }
  #view { display: grid; grid-template-rows: auto 1fr; gap: var(--gap); min-height: 0; }
  /* The week list stretches over the height left under the hero; fit() shrinks the page when even that is too tall. */
  .week { display: flex; flex-direction: column; }
  .week .day { flex: 1; align-items: center; min-height: 30px; padding: 4px 2px; border-top: 1px solid var(--hair); font-size: 14px; }
  .big { display: flex; align-items: baseline; gap: 8px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; }
  .big .unit { font-size: 0.34em; color: var(--muted); font-weight: 600; }
  .past { opacity: 0.5; }
  .today { color: var(--accent); }

  .odo { display: inline-flex; line-height: 1; height: 1em; font-variant-numeric: tabular-nums; }
  .odo .sep { opacity: 0.5; margin: 0 0.02em; }
  .odo .digit { display: inline-block; height: 1em; overflow: hidden; }
  .odo .col { display: flex; flex-direction: column; transition: transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1); will-change: transform; }
  .odo .col span { display: block; height: 1em; line-height: 1em; }

  .pills { display: flex; gap: 8px; height: 48px; }
  .pill { position: relative; min-width: 10px; }
  .pill > div, .strip > div { position: absolute; inset: 0; overflow: hidden; }
  .pill > div { border-radius: 14px; box-shadow: inset 4px 4px 8px var(--dark), inset -4px -4px 8px var(--light); }
  .fill { position: absolute; left: 0; right: 0; bottom: 0; background: var(--accent); height: 0; transition: height 0.6s ease, width 0.6s ease; }
  .fill.h { top: 0; right: auto; width: 0; height: auto; }
  .off { position: absolute; left: 0; right: 0; background: var(--off); }
  .off.h { top: 0; bottom: 0; right: auto; }
  .ring { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* The dial gives way first on a short screen, down to a floor, and its number scales with it. */
  .dial { width: clamp(150px, calc(100svh - 640px), 236px); max-width: 100%; aspect-ratio: 1; border-radius: 50%; position: relative; container-type: inline-size; box-shadow: inset 6px 6px 12px var(--dark), inset -6px -6px 12px var(--light); }
  .dial .arc { position: absolute; inset: 4.2%; border-radius: 50%; }
  .dial .face { position: absolute; inset: 12.7%; border-radius: 50%; background: var(--bg); box-shadow: var(--disc); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .strips { display: flex; gap: 6px; height: 14px; width: 100%; }
  .strip { position: relative; min-width: 8px; }
  .strip > div { border-radius: 7px; box-shadow: inset 2px 2px 4px var(--dark), inset -2px -2px 4px var(--light); }
  .strip > div.ring { outline-offset: 2px; }
  .stat { padding: 10px 6px; border-radius: 14px; text-align: center; }
  .stat .k { font-size: 11px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
  .stat .v { font-size: 15px; font-weight: 600; margin-top: 2px; }

  .segmented { display: flex; padding: 5px; border-radius: 16px; gap: 4px; }
  .segmented button { flex: 1; text-align: center; padding: 9px 0; border-radius: 12px; color: var(--muted); cursor: pointer; transition: color 0.25s, box-shadow 0.25s, background 0.25s; }
  .dock { display: flex; justify-content: space-between; padding: 0 6px; }
  .knob { width: 46px; height: 46px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); cursor: pointer; background: var(--bg); box-shadow: 6px 6px 12px var(--dark), -6px -6px 12px var(--light); transition: box-shadow 0.2s, color 0.2s, background-color 0.35s; }
  .knob:active { box-shadow: inset 3px 3px 6px var(--dark), inset -3px -3px 6px var(--light); color: var(--accent); }
  .knob.small { width: 36px; height: 36px; }
  /* The button shows the theme it would switch to. */
  .knob .sun { display: none; }
  :root[data-theme=dark] .knob .sun { display: block; }
  :root[data-theme=dark] .knob .moon { display: none; }

  /* The settings live in a sheet rising from the foot of the screen over a dimmed page. */
  .grip { width: 40px; height: 5px; border-radius: 3px; margin: 0 auto 10px; background: var(--off); }
  @media (pointer: coarse) { #close { display: none; } }
  @media (pointer: fine) { .grip { display: none; } }
  .backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.35); z-index: 9; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; margin: 0 auto; max-width: 440px; max-height: calc(100dvh - 48px); overflow-y: auto; overscroll-behavior: contain; background: var(--bg); border-radius: 28px 28px 0 0; padding: 18px 22px max(24px, env(safe-area-inset-bottom)); box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.25), inset 0 1px 0 var(--hi); }
  @media (min-width: 480px) { .sheet { bottom: 24px; border-radius: 28px; } }
  .segmented button[aria-disabled=true] { opacity: 0.35; cursor: default; }
  .segmented button[aria-checked=true] { background: var(--bg); box-shadow: 4px 4px 8px var(--dark), -4px -4px 8px var(--light); color: var(--accent); font-weight: 700; cursor: default; }
  .field { flex: 1; min-width: 0; padding: 12px 14px; border-radius: 14px; display: flex; align-items: center; justify-content: space-between; gap: 6px; font-variant-numeric: tabular-nums; cursor: pointer; }
  .field > span { color: var(--muted); font-size: 12px; }
  .field[aria-expanded=true] { color: var(--accent); font-weight: 700; }

  /* Two scroll-snapped wheels, hours and minutes, with a raised band marking the chosen row. */
  .picker { position: relative; isolation: isolate; display: flex; justify-content: center; align-items: center; gap: 4px; height: 180px; border-radius: 16px; }
  .picker .band { position: absolute; z-index: -1; left: 50%; top: 72px; width: 150px; height: 36px; margin-left: -75px; border-radius: 10px; background: var(--bg); box-shadow: var(--disc); }
  .wheel { height: 180px; width: 60px; overflow-y: auto; scroll-snap-type: y mandatory; overscroll-behavior: contain; scrollbar-width: none; text-align: center; font-size: 22px; font-weight: 600; color: var(--muted); -webkit-mask-image: linear-gradient(transparent, #000 35%, #000 65%, transparent); mask-image: linear-gradient(transparent, #000 35%, #000 65%, transparent); }
  .wheel::-webkit-scrollbar { display: none; }
  .wheel::before, .wheel::after { content: ""; display: block; height: 72px; }
  .wheel div { height: 36px; line-height: 36px; scroll-snap-align: center; }
  .wheel div.on { color: var(--accent); }
  .picker .colon { font-size: 22px; font-weight: 600; color: var(--muted); padding-bottom: 4px; }
</style>
</head>
<body>
<main>
  <div id="view"></div>
  <footer class="dock">
    <button type="button" id="theme" class="knob" aria-label="Switch between light and dark">
      <svg class="sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <button type="button" id="gear" class="knob" aria-label="Settings" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </footer>
</main>

<div id="backdrop" class="backdrop" hidden></div>
<section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-label="Settings" hidden>
  <div id="sheetHead" style="touch-action:none;cursor:grab;margin:-18px -22px 0;padding:14px 24px 6px">
  <div class="grip" aria-hidden="true"></div>
  <div class="row" style="align-items:center;padding:4px 2px 2px">
    <span class="caps">Settings</span>
    <button type="button" id="close" class="knob small" aria-label="Close">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  </div>
  <div id="settings" style="display:grid;gap:10px">
      <div class="caps-sm" style="margin-top:12px">Layout</div>
      <div class="segmented well" role="radiogroup" aria-label="Layout" id="layout">
        <button type="button" role="radio" data-value="relief">Relief</button>
        <button type="button" role="radio" data-value="cadran">Dial</button>
      </div>
      <div class="caps-sm" style="margin-top:12px">Usage reset</div>
      <div class="segmented well" role="radiogroup" aria-label="Reset day" id="weekday"></div>
      <div style="display:flex;gap:12px" data-row>
        <button type="button" class="field well num" id="time" data-time aria-haspopup="true" aria-expanded="false"><span>Reset time</span><b data-value></b></button>
      </div>
      <div class="caps-sm" style="margin-top:12px">Working hours</div>
      <div style="display:flex;gap:12px;align-items:center" data-row>
        <button type="button" class="field well num" id="dayStart" data-time aria-haspopup="true" aria-expanded="false"><span>Start</span><b data-value></b></button>
        <button type="button" class="field well num" id="dayEnd" data-time aria-haspopup="true" aria-expanded="false"><span>End</span><b data-value></b></button>
      </div>
      <div class="picker well" id="picker" hidden role="group" aria-label="Pick a time">
        <div class="band"></div>
        <div class="wheel" id="wheelH" tabindex="0" aria-label="Hours"></div>
        <div class="colon">:</div>
        <div class="wheel" id="wheelM" tabindex="0" aria-label="Minutes"></div>
      </div>
      <div class="caps-sm" style="margin-top:12px">Days off</div>
      <div class="segmented well" role="group" aria-label="Days off" id="restDays"></div>
      <div class="caps-sm" style="margin-top:12px">Week starts on</div>
      <div class="segmented well" role="radiogroup" aria-label="Week starts on" id="weekStart">
        <button type="button" role="radio" data-value="1">Monday</button>
        <button type="button" role="radio" data-value="0">Sunday</button>
      </div>
      <div class="caps-sm" style="margin-top:12px">Decimals</div>
      <div class="segmented well" role="radiogroup" aria-label="Decimals" id="decimals">
        <button type="button" role="radio" data-value="0">0</button>
        <button type="button" role="radio" data-value="1">1</button>
        <button type="button" role="radio" data-value="2">2</button>
        <button type="button" role="radio" data-value="3">3</button>
        <button type="button" role="radio" data-value="4">4</button>
      </div>
  </div>
</section>
<script>
const DAY = 24 * 3600 * 1000;
const DAY_NAMES = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const DAY_LETTERS = ["S", "M", "T", "W", "T", "F", "S"];
const DAY_FULL = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const LAYOUTS = ["relief", "cadran"];
const DEFAULTS = { layout: "relief", theme: "auto", weekday: 1, time: "00:00", dayStart: "09:00", dayEnd: "18:00", weekStart: 1, restDays: [], decimals: 3 };

const VALID = {
  layout: (v) => LAYOUTS.includes(v),
  weekday: (v) => Number.isInteger(v) && v >= 0 && v <= 6,
  time: (v) => /^([01]\d|2[0-3]):[0-5]\d$/.test(v),
  dayStart: (v) => VALID.time(v),
  dayEnd: (v) => VALID.time(v),
  theme: (v) => ["auto", "light", "dark"].includes(v),
  weekStart: (v) => v === 0 || v === 1,
  restDays: (v) => Array.isArray(v) && v.length <= 6 && v.every((d) => Number.isInteger(d) && d >= 0 && d <= 6) && new Set(v).size === v.length,
  decimals: (v) => Number.isInteger(v) && v >= 0 && v <= 4,
};

// Anything missing or malformed in storage falls back to its default.
function loadSettings() {
  let stored = {};
  try { stored = JSON.parse(localStorage.getItem("settings") || "{}") || {}; } catch {}
  return Object.fromEntries(Object.entries(DEFAULTS).map(([k, d]) => [k, VALID[k](stored[k]) ? stored[k] : d]));
}

function saveSettings(settings) {
  try { localStorage.setItem("settings", JSON.stringify(settings)); } catch {}
}

// Most recent reset at or before now, in local time.
function lastReset(now, { weekday, time }) {
  const [h, m] = time.split(":").map(Number);
  const d = new Date(now);
  d.setHours(h, m, 0, 0);
  d.setDate(d.getDate() - ((d.getDay() - weekday + 7) % 7));
  if (d > now) d.setDate(d.getDate() - 7);
  return d;
}

// The reset after a given one, seven calendar days on, whatever the clocks did in between.
function nextReset(start) {
  const d = new Date(start);
  d.setDate(d.getDate() + 7);
  return d;
}

function atTime(day, time) {
  const [h, m] = time.split(":").map(Number);
  const d = new Date(day);
  d.setHours(h, m, 0, 0);
  return d;
}

// Working hours of each calendar day of the week, clipped to both resets. An end at or before
// the start runs past midnight, and an end equal to the start makes a full 24-hour day.
function workDays(start, { dayStart, dayEnd, restDays }) {
  const end = nextReset(start);
  const days = [];
  const day = atTime(start, "00:00");
  day.setDate(day.getDate() - 1);
  for (; day < end; day.setDate(day.getDate() + 1)) {
    if (restDays.includes(day.getDay())) continue;
    const workStart = atTime(day, dayStart);
    const workEnd = atTime(day, dayEnd);
    if (workEnd <= workStart) workEnd.setDate(workEnd.getDate() + 1);
    const from = new Date(Math.max(workStart, start));
    const to = new Date(Math.min(workEnd, end));
    if (from < to) days.push({ from, to, clipped: from > workStart || to < workEnd });
  }
  return days;
}

function fmtDuration(ms) {
  const mins = Math.floor(ms / 60000);
  const d = Math.floor(mins / 1440), h = Math.floor(mins / 60) % 24, m = mins % 60;
  return d ? `${d}d ${h}h` : `${h}h ${String(m).padStart(2, "0")}`;
}

const pct = (x) => `${x.toFixed(1)} %`;
const hour = (d) => `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;

const settings = loadSettings();
// A layout named in the address is shown without being kept, for a link or a screenshot.
const asked = new URLSearchParams(location.search).get("layout");
if (VALID.layout(asked)) settings.layout = asked;
// A moment named in the address freezes the clock there, to look at the page at a given time.
const frozen = new Date(new URLSearchParams(location.search).get("at"));
const clock = () => Number.isNaN(frozen.getTime()) ? new Date() : new Date(frozen);
const $ = (id) => document.getElementById(id);

// Rolling counter: one column per position, holding the ten digits three times over so that
// every column can roll the same way, up when the value grows and down when it drops. A column
// about to leave the reel is moved back by one whole copy first, from wherever its roll has
// reached, which the eye cannot tell apart since the reel repeats. A digit that changes often
// rolls faster, so that each value lands before the next one comes.
const REEL = "012345678901234567890123456789";
const snap = (col, transform) => {
  col.style.transition = "none";
  col.style.transform = transform;
  void col.offsetHeight;
  col.style.transition = "";
};
const shiftReel = (col, copies) => {
  const style = getComputedStyle(col);
  const y = new DOMMatrix(style.transform).f - copies * 10 * parseFloat(style.fontSize);
  col.dataset.index = Number(col.dataset.index) + copies * 10;
  snap(col, `translateY(${y}px)`);
};

// In the background the rolls freeze while the digits move on, so every column is put back on
// its digit, in the middle copy, when the page shows again.
function settleOdo() {
  document.querySelectorAll(".odo .col").forEach((col) => {
    const index = Number(col.dataset.index);
    if (Number.isNaN(index)) return;
    col.dataset.index = 10 + (index % 10);
    snap(col, `translateY(-${10 + (index % 10)}em)`);
  });
}

function updateOdo(el, text) {
  const shape = text.replace(/\d/g, "0");
  if (el.dataset.shape !== shape) {
    el.dataset.shape = shape;
    delete el.dataset.value;
    el.innerHTML = [...text].map((ch) => /\d/.test(ch)
      ? `<span class="digit"><span class="col">${[...REEL].map((d) => `<span>${d}</span>`).join("")}</span></span>`
      : `<span class="sep">.</span>`).join("");
    el.querySelectorAll(".col").forEach((col) => col.addEventListener("transitionend", () => {
      const index = Number(col.dataset.index);
      if (index < 10 || index >= 20) shiftReel(col, index < 10 ? 1 : -1);
    }));
  }
  const up = el.dataset.value === undefined || Number(text) >= Number(el.dataset.value);
  el.dataset.value = text;
  const now = performance.now();
  const cols = el.querySelectorAll(".col");
  [...text.replace(".", "")].forEach((ch, i) => {
    const col = cols[i], digit = Number(ch);
    let index = Number(col.dataset.index);
    if (Number.isNaN(index)) {
      col.dataset.index = 10 + digit;
      return snap(col, `translateY(-${10 + digit}em)`);
    }
    if (index % 10 === digit) return;
    const step = up ? (digit - index % 10 + 10) % 10 : -((index % 10 - digit + 10) % 10);
    if (index + step >= 30 || index + step < 0) {
      shiftReel(col, step > 0 ? -1 : 1);
      index = Number(col.dataset.index);
    }
    const pace = now - Number(col.dataset.at || 0);
    col.style.transitionDuration = `${Math.round(Math.min(700, Math.max(150, pace * 0.8)))}ms`;
    col.dataset.at = now;
    col.dataset.index = index + step;
    col.style.transform = `translateY(-${index + step}em)`;
  });
}

const odo = () => `<span class="odo" data-odo aria-hidden="true"></span>`;
// Dark bands mark the hours of the day outside the session; the fill starts where the session does.
const slot = (s, i, horizontal) => {
  const [pos, size] = horizontal ? ["left", "width"] : ["bottom", "height"];
  const band = (a, b) => b > a ? `<div class="off${horizontal ? " h" : ""}" style="${pos}:${(a * 100).toFixed(2)}%;${size}:${((b - a) * 100).toFixed(2)}%"></div>` : "";
  return band(0, s.before) + band(s.after, 1) +
    `<div class="fill${horizontal ? " h" : ""}" data-fill="${i}" style="${pos}:${(s.before * 100).toFixed(2)}%"></div>`;
};

function reliefView(v) {
  return `
  <section class="hero">
    <div class="caps">You should be at</div>
    <div class="big" style="margin:12px 0 24px;font-size:clamp(56px,19vw,76px)">${odo()}<span class="unit">%</span></div>
    <div class="pills" aria-hidden="true">
      ${v.slots.map((d, i) => `<div class="pill" style="flex:1"><div class="${d.isToday ? "ring" : ""}">${slot(d, i)}</div></div>`).join("")}
    </div>
    <div class="row num" style="align-items:baseline;margin-top:22px">
      <span class="muted" style="font-size:13px">${v.todayLabel}</span><span style="font-size:15px;font-weight:600">${v.todayRange}</span>
    </div>
    <div class="row num muted" style="margin-top:6px;font-size:13px"><span>${v.todayHours}</span><span>Reset in ${v.left}</span></div>
  </section>
  ${weekCard(v)}`;
}

const weekCard = (v) => `
  <section class="card week" style="padding:8px 18px 6px">
    <div class="row caps-sm" style="padding:10px 2px 8px"><span>Week</span><span>start → end</span></div>
    ${v.days.map((d) => `<div class="row num day ${d.isToday ? "today" : d.isPast ? "past" : ""}" style="${d.isToday ? "font-weight:600" : ""}"><span>${d.name} ${d.date}${d.clip}</span><span>${d.fromPct} → ${d.toPct}</span></div>`).join("")}
  </section>`;

function cadranView(v) {
  const stat = (k, val) => `<div class="stat well"><div class="k">${k}</div><div class="v">${val}</div></div>`;
  return `
  <section class="hero" style="border-radius:34px;display:grid;gap:16px;justify-items:center">
    <div class="caps">You should be at</div>
    <div class="dial">
      <div class="arc" data-arc aria-hidden="true"></div>
      <div class="face">
        <div class="big" style="font-size:${[19.5, 18.6, 17, 15.3, 13.6][settings.decimals]}cqw;gap:0.1em">${odo()}<span class="unit">%</span></div>
      </div>
    </div>
    <div class="strips" aria-hidden="true">
      ${v.slots.map((d, i) => `<div class="strip" style="flex:1"><div class="${d.isToday ? "ring" : ""}">${slot(d, i, true)}</div></div>`).join("")}
    </div>
    <div class="num" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;width:100%;white-space:nowrap">
      ${stat("Start", v.todayFrom)}${stat("End", v.todayTo)}${stat("Reset", v.left)}
    </div>
    <div class="num muted" style="font-size:13px;white-space:nowrap">${v.todayLabel} · ${v.todayHours}</div>
  </section>
  ${weekCard(v)}`;
}

const VIEWS = { relief: reliefView, cadran: cadranView };

let pace = () => 0;
let slots = [];

function tick() {
  const now = clock();
  const target = pace(now);
  const text = target.toFixed(settings.decimals);
  document.querySelectorAll("[data-odo]").forEach((el) => {
    updateOdo(el, text);
    el.parentElement.setAttribute("aria-label", `${text} %`);
  });
  const arc = document.querySelector("[data-arc]");
  if (arc) arc.style.background = `conic-gradient(var(--accent) ${(target * 3.6).toFixed(2)}deg, var(--track) 0)`;
  document.querySelectorAll("[data-fill]").forEach((el) => {
    const f = `${(slots[el.dataset.fill].progress(now) * 100).toFixed(2)}%`;
    if (el.classList.contains("h")) el.style.width = f; else el.style.height = f;
  });
}

function render() {
  const now = clock();
  const start = lastReset(now, settings);
  const days = workDays(start, settings);
  // The budget is spent during working hours only, so the target stays flat overnight.
  const total = days.reduce((sum, d) => sum + (d.to - d.from), 0) || 1;
  const at = (t) => (days.reduce((sum, d) => sum + Math.min(Math.max(t - d.from, 0), d.to - d.from), 0) / total) * 100;
  const today = days.find((d) => d.from <= now && now < d.to)
    || days.find((d) => d.from.toDateString() === now.toDateString());
  pace = at;
  // One gauge per day of the calendar week, Monday first, spanning that day's working hours.
  // What falls outside the current session is shown dark; the rest fills as time passes.
  const end = nextReset(start);
  const first = atTime(now, "00:00");
  first.setDate(first.getDate() - ((first.getDay() - settings.weekStart + 7) % 7));
  slots = Array.from({ length: 7 }, (_, i) => {
    const day = new Date(first);
    day.setDate(day.getDate() + i);
    const from = atTime(day, settings.dayStart);
    const to = atTime(day, settings.dayEnd);
    if (to <= from) to.setDate(to.getDate() + 1);
    const rest = settings.restDays.includes(day.getDay());
    const inFrom = rest ? from : new Date(Math.min(Math.max(from, start), to));
    const inTo = rest ? from : new Date(Math.max(Math.min(to, end), inFrom));
    const frac = (t) => (t - from) / (to - from);
    return {
      day, from, to, inFrom, inTo,
      before: frac(inFrom), after: frac(inTo),
      progress: (t) => frac(Math.min(Math.max(t, inFrom), inTo)) - frac(inFrom),
    };
  });
  const current = slots.find((s) => s.from <= now && now < s.to) || slots.find((s) => s.day.toDateString() === now.toDateString());

  const v = {
    days: days.map((d) => ({
      name: DAY_NAMES[d.from.getDay()], date: d.from.getDate(),
      clip: d.clipped ? ` · ${hour(d.from)}-${hour(d.to)}` : "",
      isToday: d === today, isPast: d.to <= now,
      fromPct: pct(at(d.from)), toPct: pct(at(d.to)),
    })),
    slots: slots.map((s) => ({
      isToday: s === current, before: s.before, after: s.after,
    })),
    todayLabel: `Today, ${DAY_NAMES[now.getDay()]} ${now.getDate()}`,
    todayRange: today ? `${pct(at(today.from))} → ${pct(at(today.to))}` : "off",
    todayFrom: today ? pct(at(today.from)) : "-",
    todayTo: today ? pct(at(today.to)) : "-",
    todayHours: today ? `${hour(today.from)} → ${hour(today.to)}` : "off",
    left: fmtDuration(end - now),
  };

  // Rebuilding the view would restart the counter, so keep its node across refreshes.
  const view = $("view");
  const kept = view.querySelector("[data-odo]");
  view.innerHTML = (VIEWS[settings.layout] || reliefView)(v);
  if (kept && view.dataset.layout === settings.layout) view.querySelector("[data-odo]").replaceWith(kept);
  view.dataset.layout = settings.layout;
  tick();
  fit();
}

// The page fills the screen and never scrolls: the week list takes the room left, and when the
// content is taller than the screen even so, the whole of it is scaled down to fit.
const mainEl = document.querySelector("main");
function fit() {
  const body = getComputedStyle(document.body);
  const room = innerHeight - parseFloat(body.paddingTop) - parseFloat(body.paddingBottom);
  mainEl.style.zoom = "";
  mainEl.style.minHeight = `${room}px`;
  const need = mainEl.scrollHeight;
  if (need <= room + 1) return;
  const zoom = Math.max(0.55, room / need);
  mainEl.style.zoom = zoom;
  mainEl.style.minHeight = `${room / zoom}px`;
}
let refit = null;
addEventListener("resize", () => { clearTimeout(refit); refit = setTimeout(fit, 80); });
document.fonts.ready.then(fit);

// The reset-day row follows the chosen first day of the week.
function buildWeekdayRow() {
  const row = (role) => Array.from({ length: 7 }, (_, i) => (settings.weekStart + i) % 7)
    .map((d) => `<button type="button" role="${role}" data-value="${d}" aria-label="${DAY_FULL[d]}">${DAY_LETTERS[d]}</button>`).join("");
  $("weekday").innerHTML = row("radio");
  $("restDays").innerHTML = row("checkbox");
}

function syncSettings() {
  if ($("weekday").dataset.weekStart !== String(settings.weekStart)) {
    $("weekday").dataset.weekStart = settings.weekStart;
    buildWeekdayRow();
  }
  for (const id of ["layout", "weekday", "weekStart", "decimals"]) {
    $(id).querySelectorAll("button").forEach((b) => b.setAttribute("aria-checked", String(b.dataset.value === String(settings[id]))));
  }
  $("restDays").querySelectorAll("button").forEach((b) => {
    const off = settings.restDays.includes(Number(b.dataset.value));
    b.setAttribute("aria-checked", String(off));
    b.setAttribute("aria-disabled", String(!off && settings.restDays.length === 6));
  });
  for (const key of ["time", "dayStart", "dayEnd"]) $(key).querySelector("[data-value]").textContent = settings[key];
}

// The time picker: two wheels that snap by rows of 36px, shown under the field being edited.
const ROW = 36;
const picker = $("picker");
const wheels = { h: $("wheelH"), m: $("wheelM") };
let pickerKey = null;
wheels.h.innerHTML = Array.from({ length: 24 }, (_, i) => `<div>${String(i).padStart(2, "0")}</div>`).join("");
wheels.m.innerHTML = Array.from({ length: 60 }, (_, i) => `<div>${String(i).padStart(2, "0")}</div>`).join("");

function markWheel(wheel, index) {
  wheel.querySelectorAll("div").forEach((d, i) => d.classList.toggle("on", i === index));
}

const EASE = "cubic-bezier(0.2, 0.8, 0.2, 1)";

// The theme follows the system until the button picks one; the chosen one is kept.
const darkQuery = matchMedia("(prefers-color-scheme: dark)");
function applyTheme() {
  const dark = settings.theme === "auto" ? darkQuery.matches : settings.theme === "dark";
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  document.querySelector("meta[name=theme-color]").content = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
}
darkQuery.addEventListener("change", applyTheme);

// The settings sheet rises from the foot of the screen and sinks back when dismissed.
const sheet = $("sheet"), backdrop = $("backdrop");
function openSheet() {
  sheet.hidden = backdrop.hidden = false;
  mainEl.inert = true;
  document.body.style.overflow = "hidden";
  backdrop.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 250, easing: EASE });
  sheet.animate([{ transform: "translateY(60px)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 320, easing: EASE });
  sheet.scrollTop = 0;
  $("close").focus({ preventScroll: true });
}
function closeSheet() {
  if (sheet.hidden) return;
  closePicker();
  const veil = backdrop.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 220, easing: "ease-in", fill: "forwards" });
  const out = sheet.animate([{ transform: getComputedStyle(sheet).transform, opacity: 1 }, { transform: "translateY(80px)", opacity: 0 }], { duration: 220, easing: "ease-in", fill: "forwards" });
  afterAnimation(out, () => {
    sheet.hidden = backdrop.hidden = true;
    veil.cancel();
    out.cancel();
    sheet.style.transform = "";
    mainEl.inert = false;
    document.body.style.overflow = "";
    $("gear").focus({ preventScroll: true });
  });
}

// Dragging the head of the sheet downwards dismisses it, as a native sheet would.
const head = $("sheetHead");
let drag = null;
head.addEventListener("pointerdown", (e) => {
  if (e.button !== 0 || e.target.closest("button")) return;
  drag = { y: e.clientY, dy: 0 };
  head.setPointerCapture(e.pointerId);
});
head.addEventListener("pointermove", (e) => {
  if (!drag) return;
  drag.dy = Math.max(0, e.clientY - drag.y);
  sheet.style.transform = `translateY(${drag.dy}px)`;
});
const endDrag = () => {
  if (!drag) return;
  const { dy } = drag;
  drag = null;
  if (dy > 90) return closeSheet();
  const back = sheet.animate([{ transform: `translateY(${dy}px)` }, { transform: "none" }], { duration: 260, easing: EASE });
  sheet.style.transform = "";
  afterAnimation(back, () => {});
};
head.addEventListener("pointerup", endDrag);
head.addEventListener("pointercancel", endDrag);

// A page in the background does not play its animations, so what follows one runs on a timer too.
function afterAnimation(animation, fn) {
  let done = false;
  const once = () => { if (!done) { done = true; fn(); } };
  animation.finished.then(once, once);
  setTimeout(once, animation.effect.getTiming().duration + 50);
}

function closePicker() {
  pickerKey = null;
  picker.hidden = true;
  document.querySelectorAll("[data-time]").forEach((b) => b.setAttribute("aria-expanded", "false"));
}

function openPicker(btn) {
  const key = btn.id;
  if (pickerKey === key) return closePicker();
  closePicker();
  pickerKey = key;
  btn.setAttribute("aria-expanded", "true");
  btn.closest("[data-row]").after(picker);
  picker.hidden = false;
  requestAnimationFrame(() => picker.scrollIntoView({ block: "nearest", behavior: "smooth" }));
  const [h, m] = settings[key].split(":").map(Number);
  for (const [wheel, index] of [[wheels.h, h], [wheels.m, m]]) {
    markWheel(wheel, index);
    wheel.scrollTo({ top: index * ROW, behavior: "instant" });
  }
}

let settle = null;
function commitWheels() {
  if (!pickerKey) return;
  const h = Math.round(wheels.h.scrollTop / ROW), m = Math.round(wheels.m.scrollTop / ROW);
  markWheel(wheels.h, h);
  markWheel(wheels.m, m);
  const value = `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
  if (value !== settings[pickerKey]) update({ [pickerKey]: value });
}
const hasScrollEnd = "onscrollend" in window;
for (const wheel of Object.values(wheels)) {
  if (hasScrollEnd) wheel.addEventListener("scrollend", commitWheels);
  else wheel.addEventListener("scroll", () => { clearTimeout(settle); settle = setTimeout(commitWheels, 150); }, { passive: true });
}
// A tap on a visible row picks it straight away, no need to roll the wheel by one.
for (const wheel of Object.values(wheels)) {
  wheel.addEventListener("click", (e) => {
    const row = e.target.closest("div");
    if (row && row.parentElement === wheel) wheel.scrollTo({ top: [...wheel.children].indexOf(row) * ROW, behavior: "smooth" });
  });
}

// A change of layout sinks the view into the background, then the new one rises out of it;
// any other change fades the view in.
function update(patch) {
  const from = settings.layout;
  for (const [k, v] of Object.entries(patch)) if (VALID[k](v)) settings[k] = v;
  saveSettings(settings);
  syncSettings();
  applyTheme();
  const view = $("view");
  if (Object.keys(patch).every((k) => k === "theme")) return;
  if (settings.layout === from) {
    const fade = view.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 140, easing: "ease-in", fill: "forwards" });
    afterAnimation(fade, () => {
      fade.cancel();
      render();
      view.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 260, easing: EASE });
    });
    return;
  }
  const sink = view.animate(
    [{ transform: "scale(1)", opacity: 1, filter: "blur(0)" }, { transform: "scale(0.92)", opacity: 0, filter: "blur(3px)" }],
    { duration: 220, easing: "ease-in", fill: "forwards" });
  afterAnimation(sink, () => {
    sink.cancel();
    render();
    view.animate(
      [{ transform: "scale(0.92)", opacity: 0, filter: "blur(3px)" }, { transform: "scale(1)", opacity: 1, filter: "blur(0)" }],
      { duration: 380, easing: EASE });
  });
}

$("gear").onclick = openSheet;
$("close").onclick = closeSheet;
backdrop.onclick = closeSheet;
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { if (pickerKey) closePicker(); else closeSheet(); } });
$("theme").onclick = () => update({ theme: document.documentElement.dataset.theme === "dark" ? "light" : "dark" });
$("layout").onclick = (e) => { const b = e.target.closest("button"); if (b) update({ layout: b.dataset.value }); };
$("weekday").onclick = (e) => { const b = e.target.closest("button"); if (b) update({ weekday: Number(b.dataset.value) }); };
$("restDays").onclick = (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  const day = Number(b.dataset.value);
  const restDays = settings.restDays.includes(day) ? settings.restDays.filter((d) => d !== day) : [...settings.restDays, day];
  if (restDays.length < 7) update({ restDays });
};
$("weekStart").onclick = (e) => { const b = e.target.closest("button"); if (b) update({ weekStart: Number(b.dataset.value) }); };
$("decimals").onclick = (e) => { const b = e.target.closest("button"); if (b) update({ decimals: Number(b.dataset.value) }); };
document.querySelectorAll("[data-time]").forEach((b) => b.addEventListener("click", () => openPicker(b)));

// Reload on its own when a new version is published, so the page never needs a manual refresh.
let loadedPage = null;
async function checkForUpdate() {
  try {
    if (loadedPage === null && "caches" in window) {
      const cached = await caches.match(location.href);
      if (cached) loadedPage = await cached.text();
    }
    const text = await (await fetch(location.pathname, { cache: "no-store" })).text();
    if (loadedPage === null) loadedPage = text;
    else if (text !== loadedPage) location.reload();
  } catch {}
}

applyTheme();
syncSettings();
render();
checkForUpdate();
setInterval(tick, 250);
setInterval(render, 30000);
setInterval(checkForUpdate, 5 * 60000);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) { settleOdo(); render(); checkForUpdate(); }
});

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
